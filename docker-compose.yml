version: "3.8"

name: cthree-discord-bot-development

services:
  database:
    image: postgres:17
    container_name: bot_database
    environment:
      POSTGRES_USER: cthreebot
      POSTGRES_PASSWORD: password
      POSTGRES_DB: cthree-discord-bot
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
